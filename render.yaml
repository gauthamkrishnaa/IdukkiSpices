services:
  - type: web
    name: idukki-spices
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: 10
      - key: EMAIL_CONCURRENCY
        value: 4
      - key: PUBLIC_BASE_URL
        sync: false
      - key: EMAIL_LOGO_URL
        value: https://theidukkispices.com/assets/idukki-spices-logo.jpeg?v=20260711
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: COMPANY_EMAIL
        sync: false
