          <h1>Épices du Kerala livrées en France – Idukki Spices</h1>
          <p>Idukki Spices propose en France une sélection d’épices inspirées des hauts plateaux verdoyants d’Idukki, au Kerala. Notre boutique met particulièrement en valeur la cardamome verte de calibre spécial 7 mm, appréciée pour son parfum frais, sa couleur naturelle et son utilisation dans le thé, les desserts, le biryani, le riz parfumé et les currys mijotés. Nous proposons également du poivre noir, des clous de girofle, de la cannelle, de l’anis étoilé, des feuilles de laurier et un mélange d’épices pratique pour la cuisine quotidienne.</p>
          <p>Chaque produit est présenté avec son poids, son prix, une photographie et une description claire afin de vous aider à choisir le sachet adapté. Vous pouvez ajouter plusieurs quantités au panier, vérifier le nombre total d’articles et consulter le récapitulatif avant le paiement. La commande minimale est de 20 €, la livraison coûte 4,99 € et elle devient gratuite à partir de 50 €. Les livraisons sont actuellement limitées aux adresses françaises vérifiables.</p>
          <p>Le paiement en ligne est sécurisé et une commande n’est confirmée qu’après la validation du paiement. Les clients peuvent créer un compte avec un code de connexion à usage unique, enregistrer leurs coordonnées de livraison et suivre les principales étapes de leurs commandes. Des notifications et des e-mails informent le client lors de la confirmation, de l’expédition, d’une annulation ou d’un remboursement. Notre équipe peut également répondre aux questions concernant les produits, les commandes familiales, les besoins professionnels et la livraison.</p>
          <p>Découvrez notre <a href="/shop.html">boutique d’épices</a>, apprenez-en davantage sur <a href="/about.html">notre histoire et nos produits du Kerala</a>, consultez votre <a href="/cart.html">panier</a> ou écrivez-nous depuis la page <a href="/contact.html">contact</a>. Avant de commander, vous pouvez aussi lire nos informations sur la <a href="/shipping.html">livraison</a>, les <a href="/refunds.html">remboursements</a>, la <a href="/privacy.html">confidentialité</a> et les <a href="/terms.html">conditions générales</a>. Retrouvez également Idukki Spices sur <a href="https://www.instagram.com/idukkispicesfr" rel="noopener noreferrer">Instagram</a>.</p>
