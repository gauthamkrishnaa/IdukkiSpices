<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment Successful | Idukki Spices</title>
    <meta name="description" content="Payment successful for your Idukki Spices order.">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="payment-success">
    <header class="site-header">
      <nav class="nav" aria-label="Main navigation">
        <a class="brand" href="index.html"><img class="brand-logo" src="assets/idukki-spices-logo.jpeg" alt="Idukki Spices logo"><span>Idukki Spices</span></a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="shop.html">Shop</a>
          <a href="account.html" data-account-link>Account</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="section success-layout" data-payment-success>
        <div class="success-card">
          <span class="success-mark">✓</span>
          <p class="eyebrow">Payment complete</p>
          <h1>Thank you for your order</h1>
          <p>Your payment was successful. We are preparing your spices and will update the delivery status soon.</p>
          <div class="actions">
            <a class="button" data-success-order-link href="account.html">View order details</a>
            <a class="button light" href="shop.html">Continue shopping</a>
          </div>
          <p class="form-note" data-success-note></p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <strong>Idukki Spices</strong>
        <span>Fresh spices, packed with care.</span>
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
